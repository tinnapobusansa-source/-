<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>แต้มสะสม</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#FF6B6B" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
  body { font-family: 'Nunito', sans-serif; }
  .font-display { font-family: 'Baloo 2', sans-serif; }
  .font-body { font-family: 'Nunito', sans-serif; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
</style>
</head>
<body style="background:#FFF8E7;">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const STORAGE_KEY = "reward-jar:state";
const DEFAULT_PIN = "1234";

const DEFAULT_STATE = {
  pin: DEFAULT_PIN,
  kids: [{ id: "k1", name: "น้องหมูเด้ง", points: 0, color: "#FF6B6B" }],
  tasks: [
    { id: "t1", name: "เก็บของเล่นเข้าที่", points: 5 },
    { id: "t2", name: "แปรงฟันเช้า-เย็น", points: 5 },
    { id: "t3", name: "ทำการบ้านเสร็จ", points: 10 },
    { id: "t4", name: "ช่วยงานบ้าน", points: 10 },
  ],
  challenges: [{ id: "c1", name: "ท้าพ่อแข่งบอร์ดเกม", winPoints: 5, losePoints: 5 }],
  rewards: [
    { id: "r1", name: "ดูการ์ตูนเพิ่ม 20 นาที", cost: 20 },
    { id: "r2", name: "เลือกเมนูมื้อเย็น", cost: 30 },
    { id: "r3", name: "ของเล่นชิ้นเล็ก", cost: 100 },
  ],
  history: [],
};

const KID_COLORS = ["#FF6B6B", "#4ECDC4", "#5C4B99", "#FFC145", "#3DAA6B"];

function uid() {
  return Math.random().toString(36).slice(2, 9);
}

// ---- tiny icon helpers (emoji-based, no external icon deps needed) ----
const Icon = ({ children, size = 18, style = {} }) => (
  <span style={{ fontSize: size, lineHeight: 1, display: "inline-flex", ...style }}>{children}</span>
);

function StickerJar({ points, color }) {
  const stars = Math.min(20, Math.floor(Math.max(0, points) / 5));
  return (
    <div className="relative w-full h-40 flex items-end justify-center">
      <div
        className="relative w-32 h-36 rounded-b-[2.5rem] rounded-t-xl border-[6px] overflow-hidden flex flex-wrap content-end justify-center gap-1 p-2"
        style={{ borderColor: color, background: "#FFFDF6" }}
      >
        <div
          className="absolute bottom-0 left-0 right-0 transition-all duration-700"
          style={{
            height: `${Math.min(100, Math.max(0, points))}%`,
            background: `linear-gradient(180deg, ${color}33, ${color}66)`,
          }}
        />
        {Array.from({ length: stars }).map((_, i) => (
          <span
            key={i}
            className="relative z-10"
            style={{ color, fontSize: 14, animation: `pop 0.4s ease ${i * 0.03}s both` }}
          >
            ★
          </span>
        ))}
      </div>
    </div>
  );
}

function PinModal({ title, subtitle, onConfirm, onCancel, correctPin }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    inputRef.current && inputRef.current.focus();
  }, []);

  const submit = () => {
    if (value === correctPin) {
      onConfirm();
    } else {
      setError(true);
      setValue("");
      setTimeout(() => setError(false), 500);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-5 font-body">
      <div
        className="bg-white rounded-3xl p-6 w-full max-w-xs text-center"
        style={{ animation: error ? "shake 0.4s" : undefined }}
      >
        <div className="w-12 h-12 rounded-full bg-[#5C4B99]/10 flex items-center justify-center mx-auto mb-3">
          <Icon size={22} style={{ color: "#5C4B99" }}>🔒</Icon>
        </div>
        <h3 className="font-display text-lg text-[#4A4458]">{title}</h3>
        {subtitle && <p className="text-xs text-[#9c93a3] mt-1">{subtitle}</p>}
        <input
          ref={inputRef}
          type="password"
          inputMode="numeric"
          value={value}
          onChange={(e) => setValue(e.target.value.replace(/\D/g, "").slice(0, 6))}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder="รหัสผ่าน"
          className={`w-full mt-4 text-center tracking-[0.4em] text-lg rounded-xl px-3 py-2.5 border ${
            error ? "border-[#FF6B6B]" : "border-[#eee1c6]"
          } focus:outline-none focus:ring-2 focus:ring-[#5C4B99]`}
        />
        {error && <p className="text-[#FF6B6B] text-xs mt-1.5">รหัสไม่ถูกต้องค่ะ ลองใหม่นะคะ</p>}
        <div className="flex gap-2 mt-4">
          <button onClick={onCancel} className="flex-1 py-2.5 rounded-xl font-display text-sm bg-[#f1eee8] text-[#8b8398]">
            ยกเลิก
          </button>
          <button onClick={submit} className="flex-1 py-2.5 rounded-xl font-display text-sm bg-[#5C4B99] text-white">
            ยืนยัน
          </button>
        </div>
      </div>
    </div>
  );
}

function ChallengeResultModal({ challenge, onResult, onCancel }) {
  return (
    <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-5 font-body">
      <div className="bg-white rounded-3xl p-6 w-full max-w-xs text-center">
        <div className="w-12 h-12 rounded-full bg-[#5C4B99]/10 flex items-center justify-center mx-auto mb-3">
          <Icon size={22} style={{ color: "#5C4B99" }}>⚔️</Icon>
        </div>
        <h3 className="font-display text-lg text-[#4A4458]">{challenge.name}</h3>
        <p className="text-xs text-[#9c93a3] mt-1">ผลการแข่งขันเป็นยังไงคะ?</p>
        <div className="flex gap-2 mt-4">
          <button
            onClick={() => onResult("lose")}
            className="flex-1 py-3 rounded-xl font-display text-sm bg-[#f1eee8] text-[#8b8398] flex flex-col items-center gap-1"
          >
            <Icon size={18}>😞</Icon>
            แพ้ (-{challenge.losePoints})
          </button>
          <button
            onClick={() => onResult("win")}
            className="flex-1 py-3 rounded-xl font-display text-sm bg-[#FFC145] text-[#5C3A00] flex flex-col items-center gap-1"
          >
            <Icon size={18}>🏆</Icon>
            ชนะ (+{challenge.winPoints})
          </button>
        </div>
        <button onClick={onCancel} className="text-xs text-[#b3aab8] mt-3 underline">
          ยกเลิก
        </button>
      </div>
    </div>
  );
}

function RewardJarApp() {
  const [data, setData] = useState(DEFAULT_STATE);
  const [loaded, setLoaded] = useState(false);
  const [activeKidId, setActiveKidId] = useState(null);
  const [tab, setTab] = useState("tasks");
  const [manageOpen, setManageOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [pinRequest, setPinRequest] = useState(null);
  const [pendingChallenge, setPendingChallenge] = useState(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const merged = { ...DEFAULT_STATE, ...parsed };
        setData(merged);
        setActiveKidId((merged.kids && merged.kids[0] && merged.kids[0].id) || null);
      } else {
        setActiveKidId(DEFAULT_STATE.kids[0].id);
      }
    } catch (e) {
      setActiveKidId(DEFAULT_STATE.kids[0].id);
    }
    setLoaded(true);
  }, []);

  const persist = useCallback((next) => {
    setData(next);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      console.error("บันทึกข้อมูลไม่สำเร็จ", e);
    }
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 1800);
  };

  const activeKid = data.kids.find((k) => k.id === activeKidId) || data.kids[0];

  const applyDelta = (label, delta) => {
    if (!activeKid) return;
    const next = {
      ...data,
      kids: data.kids.map((k) => (k.id === activeKid.id ? { ...k, points: k.points + delta } : k)),
      history: [
        { id: uid(), kidId: activeKid.id, label, delta, at: Date.now() },
        ...data.history,
      ].slice(0, 50),
    };
    persist(next);
  };

  const requestAwardTask = (task) => {
    setPinRequest({
      title: "ใส่รหัสผ่านของพ่อ/แม่",
      subtitle: `ยืนยันให้แต้ม "${task.name}"`,
      onConfirm: () => {
        applyDelta(task.name, task.points);
        showToast(`+${task.points} แต้ม! เก่งมาก 🌟`);
        setPinRequest(null);
      },
    });
  };

  const requestChallenge = (challenge) => {
    setPinRequest({
      title: "ใส่รหัสผ่านของพ่อ/แม่",
      subtitle: `ยืนยันผล "${challenge.name}"`,
      onConfirm: () => {
        setPinRequest(null);
        setPendingChallenge(challenge);
      },
    });
  };

  const resolveChallenge = (result) => {
    const c = pendingChallenge;
    setPendingChallenge(null);
    if (!c) return;
    if (result === "win") {
      applyDelta(`ชนะ: ${c.name}`, c.winPoints);
      showToast(`ชนะแล้ว! +${c.winPoints} แต้ม 🏆`);
    } else {
      applyDelta(`แพ้: ${c.name}`, -c.losePoints);
      showToast(`แพ้ไปครั้งนี้ -${c.losePoints} แต้ม สู้ใหม่นะ`);
    }
  };

  const requestOpenSettings = () => {
    setPinRequest({
      title: "ใส่รหัสผ่านของพ่อ/แม่",
      subtitle: "เข้าสู่หน้าตั้งค่า",
      onConfirm: () => {
        setPinRequest(null);
        setManageOpen(true);
      },
    });
  };

  const redeem = (reward) => {
    if (!activeKid || activeKid.points < reward.cost) {
      showToast("แต้มยังไม่พอนะ สู้ๆ!");
      return;
    }
    applyDelta(`แลก: ${reward.name}`, -reward.cost);
    showToast(`แลกสำเร็จ! 🎁 ${reward.name}`);
  };

  const addKid = (name) => {
    if (!name.trim()) return;
    const color = KID_COLORS[data.kids.length % KID_COLORS.length];
    const kid = { id: uid(), name: name.trim(), points: 0, color };
    const next = { ...data, kids: [...data.kids, kid] };
    persist(next);
    setActiveKidId(kid.id);
  };
  const removeKid = (id) => {
    const next = { ...data, kids: data.kids.filter((k) => k.id !== id) };
    persist(next);
    if (activeKidId === id) setActiveKidId((next.kids[0] && next.kids[0].id) || null);
  };
  const addTask = (name, points) => {
    if (!name.trim() || !points) return;
    persist({ ...data, tasks: [...data.tasks, { id: uid(), name: name.trim(), points: Number(points) }] });
  };
  const removeTask = (id) => persist({ ...data, tasks: data.tasks.filter((t) => t.id !== id) });
  const addChallenge = (name, winPoints, losePoints) => {
    if (!name.trim() || !winPoints || !losePoints) return;
    persist({
      ...data,
      challenges: [
        ...data.challenges,
        { id: uid(), name: name.trim(), winPoints: Number(winPoints), losePoints: Number(losePoints) },
      ],
    });
  };
  const removeChallenge = (id) => persist({ ...data, challenges: data.challenges.filter((c) => c.id !== id) });
  const addReward = (name, cost) => {
    if (!name.trim() || !cost) return;
    persist({ ...data, rewards: [...data.rewards, { id: uid(), name: name.trim(), cost: Number(cost) }] });
  };
  const removeReward = (id) => persist({ ...data, rewards: data.rewards.filter((r) => r.id !== id) });
  const changePin = (newPin) => {
    if (!/^\d{4,6}$/.test(newPin)) {
      showToast("รหัสต้องเป็นตัวเลข 4-6 หลักค่ะ");
      return;
    }
    persist({ ...data, pin: newPin });
    showToast("เปลี่ยนรหัสผ่านแล้วค่ะ");
  };

  if (!loaded) {
    return (
      <div className="w-full min-h-screen flex items-center justify-center font-body" style={{ background: "#FFF8E7" }}>
        <p className="text-[#5C4B99] font-display text-lg">กำลังโหลด...</p>
      </div>
    );
  }

  const kidColor = (activeKid && activeKid.color) || "#FF6B6B";

  return (
    <div className="w-full min-h-screen font-body" style={{ background: "#FFF8E7" }}>
      <div className="max-w-md mx-auto min-h-screen bg-[#FFF8E7] shadow-xl">
        <div className="px-5 pt-6 pb-4" style={{ background: kidColor }}>
          <div className="flex items-center justify-between">
            <h1 className="font-display text-2xl text-white flex items-center gap-2">
              <Icon size={22}>✨</Icon> แต้มสะสม
            </h1>
            <button
              onClick={requestOpenSettings}
              className="text-white/90 hover:text-white p-2 rounded-full hover:bg-white/15 transition"
              aria-label="ตั้งค่า"
            >
              <Icon size={22}>⚙️</Icon>
            </button>
          </div>

          <div className="flex gap-2 mt-4 overflow-x-auto pb-1">
            {data.kids.map((k) => (
              <button
                key={k.id}
                onClick={() => setActiveKidId(k.id)}
                className={`shrink-0 px-4 py-1.5 rounded-full font-display text-sm transition ${
                  k.id === activeKidId ? "bg-white shadow" : "bg-white/25 text-white"
                }`}
                style={k.id === activeKidId ? { color: kidColor } : {}}
              >
                {k.name}
              </button>
            ))}
          </div>
        </div>

        {!activeKid ? (
          <div className="p-6 text-center font-body text-[#5C4B99]">
            <p className="mb-3">ยังไม่มีข้อมูลเด็กเลยค่ะ เพิ่มก่อนได้ที่ปุ่มตั้งค่า</p>
          </div>
        ) : (
          <React.Fragment>
            <div className="px-5 -mt-1">
              <div className="bg-white rounded-3xl shadow-sm px-4 pt-2 pb-4 flex flex-col items-center">
                <StickerJar points={activeKid.points} color={kidColor} />
                <p className="font-display text-3xl mt-1" style={{ color: kidColor }}>
                  {activeKid.points} แต้ม
                </p>
              </div>
            </div>

            <div className="flex px-5 mt-5 gap-2">
              {[
                { key: "tasks", label: "ภารกิจ", icon: "✅" },
                { key: "rewards", label: "ร้านของรางวัล", icon: "🎁" },
                { key: "history", label: "ประวัติ", icon: "⭐" },
              ].map(({ key, label, icon }) => (
                <button
                  key={key}
                  onClick={() => setTab(key)}
                  className="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-2xl font-display text-sm transition"
                  style={tab === key ? { background: kidColor, color: "white" } : { background: "#fff", color: "#8b8398" }}
                >
                  <Icon size={14}>{icon}</Icon> {label}
                </button>
              ))}
            </div>

            <div className="px-5 mt-4 pb-8 space-y-2.5">
              {tab === "tasks" && (
                <React.Fragment>
                  {data.tasks.length === 0 ? (
                    <EmptyState text="ยังไม่มีภารกิจ เพิ่มได้ที่ปุ่มตั้งค่านะคะ" />
                  ) : (
                    data.tasks.map((t) => (
                      <button
                        key={t.id}
                        onClick={() => requestAwardTask(t)}
                        className="w-full bg-white rounded-2xl px-4 py-3.5 flex items-center justify-between shadow-sm active:scale-[0.98] transition"
                      >
                        <span className="font-body font-semibold text-[#4A4458] text-left">{t.name}</span>
                        <span
                          className="font-display text-sm px-3 py-1 rounded-full text-white shrink-0 ml-2 flex items-center gap-1"
                          style={{ background: kidColor }}
                        >
                          <Icon size={11}>🔒</Icon> +{t.points}
                        </span>
                      </button>
                    ))
                  )}

                  {data.challenges.length > 0 && (
                    <React.Fragment>
                      <p className="font-display text-sm text-[#9c93a3] pt-3 pb-1 flex items-center gap-1.5">
                        <Icon size={14}>⚔️</Icon> ท้าทายพิเศษ
                      </p>
                      {data.challenges.map((c) => (
                        <button
                          key={c.id}
                          onClick={() => requestChallenge(c)}
                          className="w-full bg-white rounded-2xl px-4 py-3.5 flex items-center justify-between shadow-sm active:scale-[0.98] transition border-2 border-dashed"
                          style={{ borderColor: `${kidColor}55` }}
                        >
                          <span className="font-body font-semibold text-[#4A4458] text-left">{c.name}</span>
                          <span className="font-display text-xs px-3 py-1 rounded-full text-[#5C4B99] bg-[#5C4B99]/10 shrink-0 ml-2 flex items-center gap-1">
                            <Icon size={11}>🔒</Icon> ชนะ +{c.winPoints} / แพ้ -{c.losePoints}
                          </span>
                        </button>
                      ))}
                    </React.Fragment>
                  )}
                </React.Fragment>
              )}

              {tab === "rewards" &&
                (data.rewards.length === 0 ? (
                  <EmptyState text="ยังไม่มีของรางวัล เพิ่มได้ที่ปุ่มตั้งค่านะคะ" />
                ) : (
                  data.rewards.map((r) => {
                    const canRedeem = activeKid.points >= r.cost;
                    return (
                      <button
                        key={r.id}
                        onClick={() => redeem(r)}
                        className={`w-full rounded-2xl px-4 py-3.5 flex items-center justify-between shadow-sm transition ${
                          canRedeem ? "bg-white active:scale-[0.98]" : "bg-white/60"
                        }`}
                      >
                        <span className={`font-body font-semibold text-left ${canRedeem ? "text-[#4A4458]" : "text-[#c3bcc9]"}`}>
                          {r.name}
                        </span>
                        <span
                          className="font-display text-sm px-3 py-1 rounded-full shrink-0 ml-2"
                          style={canRedeem ? { background: "#FFC145", color: "#5C3A00" } : { background: "#f1eee8", color: "#b3aab8" }}
                        >
                          {r.cost} แต้ม
                        </span>
                      </button>
                    );
                  })
                ))}

              {tab === "history" &&
                (data.history.filter((h) => h.kidId === activeKid.id).length === 0 ? (
                  <EmptyState text="ยังไม่มีประวัติเลยค่ะ เริ่มทำภารกิจได้เลย!" />
                ) : (
                  data.history
                    .filter((h) => h.kidId === activeKid.id)
                    .map((h) => (
                      <div key={h.id} className="bg-white rounded-2xl px-4 py-3 flex items-center justify-between shadow-sm">
                        <span className="font-body text-[#4A4458] text-sm">{h.label}</span>
                        <span className="font-display text-sm" style={{ color: h.delta > 0 ? "#3DAA6B" : "#FF6B6B" }}>
                          {h.delta > 0 ? "+" : ""}
                          {h.delta}
                        </span>
                      </div>
                    ))
                ))}
            </div>
          </React.Fragment>
        )}

        {toast && (
          <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#5C4B99] text-white font-display px-5 py-2.5 rounded-full shadow-lg text-sm z-50">
            {toast}
          </div>
        )}

        {pinRequest && (
          <PinModal
            title={pinRequest.title}
            subtitle={pinRequest.subtitle}
            correctPin={data.pin}
            onConfirm={pinRequest.onConfirm}
            onCancel={() => setPinRequest(null)}
          />
        )}

        {pendingChallenge && (
          <ChallengeResultModal challenge={pendingChallenge} onResult={resolveChallenge} onCancel={() => setPendingChallenge(null)} />
        )}

        {manageOpen && (
          <ManagePanel
            data={data}
            onClose={() => setManageOpen(false)}
            addKid={addKid}
            removeKid={removeKid}
            addTask={addTask}
            removeTask={removeTask}
            addChallenge={addChallenge}
            removeChallenge={removeChallenge}
            addReward={addReward}
            removeReward={removeReward}
            changePin={changePin}
          />
        )}
      </div>
    </div>
  );
}

function EmptyState({ text }) {
  return <div className="text-center py-10 px-4 text-[#b3aab8] font-body text-sm">{text}</div>;
}

function ManagePanel({ data, onClose, addKid, removeKid, addTask, removeTask, addChallenge, removeChallenge, addReward, removeReward, changePin }) {
  const [section, setSection] = useState("kids");
  const [kidName, setKidName] = useState("");
  const [taskName, setTaskName] = useState("");
  const [taskPoints, setTaskPoints] = useState("");
  const [challengeName, setChallengeName] = useState("");
  const [challengeWin, setChallengeWin] = useState("");
  const [challengeLose, setChallengeLose] = useState("");
  const [rewardName, setRewardName] = useState("");
  const [rewardCost, setRewardCost] = useState("");
  const [pin1, setPin1] = useState("");
  const [pin2, setPin2] = useState("");

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center sm:justify-center font-body">
      <div className="bg-[#FFF8E7] w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl max-h-[85vh] overflow-y-auto">
        <div className="sticky top-0 bg-[#FFF8E7] flex items-center justify-between px-5 py-4 border-b border-[#eee1c6]">
          <h2 className="font-display text-lg text-[#5C4B99] flex items-center gap-2">
            <Icon size={18}>👥</Icon> ตั้งค่า
          </h2>
          <button onClick={onClose} className="p-1.5 rounded-full hover:bg-black/5">
            <Icon size={20} style={{ color: "#5C4B99" }}>✕</Icon>
          </button>
        </div>

        <div className="flex px-5 pt-3 gap-2 flex-wrap">
          {[
            { key: "kids", label: "เด็ก" },
            { key: "tasks", label: "ภารกิจ" },
            { key: "challenges", label: "ท้าทาย" },
            { key: "rewards", label: "ของรางวัล" },
            { key: "pin", label: "รหัสผ่าน" },
          ].map((s) => (
            <button
              key={s.key}
              onClick={() => setSection(s.key)}
              className="px-3.5 py-1.5 rounded-full font-display text-sm"
              style={section === s.key ? { background: "#5C4B99", color: "white" } : { background: "#fff", color: "#8b8398" }}
            >
              {s.label}
            </button>
          ))}
        </div>

        <div className="p-5 space-y-2.5">
          {section === "kids" && (
            <React.Fragment>
              {data.kids.map((k) => (
                <div key={k.id} className="bg-white rounded-2xl px-4 py-3 flex items-center justify-between">
                  <span className="font-semibold text-[#4A4458]">{k.name}</span>
                  <button onClick={() => removeKid(k.id)} className="text-[#c3757a] p-1">
                    <Icon size={17}>🗑️</Icon>
                  </button>
                </div>
              ))}
              <div className="flex gap-2 pt-1">
                <input
                  value={kidName}
                  onChange={(e) => setKidName(e.target.value)}
                  placeholder="ชื่อเด็ก"
                  className="flex-1 rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                />
                <button
                  onClick={() => { addKid(kidName); setKidName(""); }}
                  className="bg-[#5C4B99] text-white rounded-xl px-3.5 flex items-center justify-center"
                >
                  <Icon size={18}>➕</Icon>
                </button>
              </div>
            </React.Fragment>
          )}

          {section === "tasks" && (
            <React.Fragment>
              {data.tasks.map((t) => (
                <div key={t.id} className="bg-white rounded-2xl px-4 py-3 flex items-center justify-between">
                  <span className="font-semibold text-[#4A4458]">{t.name}</span>
                  <div className="flex items-center gap-3">
                    <span className="text-sm text-[#8b8398]">+{t.points}</span>
                    <button onClick={() => removeTask(t.id)} className="text-[#c3757a] p-1">
                      <Icon size={17}>🗑️</Icon>
                    </button>
                  </div>
                </div>
              ))}
              <div className="flex gap-2 pt-1">
                <input
                  value={taskName}
                  onChange={(e) => setTaskName(e.target.value)}
                  placeholder="ชื่อภารกิจ"
                  className="flex-1 rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                />
                <input
                  value={taskPoints}
                  onChange={(e) => setTaskPoints(e.target.value.replace(/\D/g, ""))}
                  placeholder="แต้ม"
                  className="w-16 rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                />
                <button
                  onClick={() => { addTask(taskName, taskPoints); setTaskName(""); setTaskPoints(""); }}
                  className="bg-[#5C4B99] text-white rounded-xl px-3.5 flex items-center justify-center"
                >
                  <Icon size={18}>➕</Icon>
                </button>
              </div>
            </React.Fragment>
          )}

          {section === "challenges" && (
            <React.Fragment>
              <p className="text-xs text-[#9c93a3] pb-1">กิจกรรมที่มีแพ้-ชนะ เช่น แข่งบอร์ดเกม แข่งเกมคอม ฯลฯ</p>
              {data.challenges.map((c) => (
                <div key={c.id} className="bg-white rounded-2xl px-4 py-3 flex items-center justify-between">
                  <span className="font-semibold text-[#4A4458]">{c.name}</span>
                  <div className="flex items-center gap-3">
                    <span className="text-xs text-[#8b8398]">ชนะ +{c.winPoints} / แพ้ -{c.losePoints}</span>
                    <button onClick={() => removeChallenge(c.id)} className="text-[#c3757a] p-1">
                      <Icon size={17}>🗑️</Icon>
                    </button>
                  </div>
                </div>
              ))}
              <div className="space-y-2 pt-1">
                <input
                  value={challengeName}
                  onChange={(e) => setChallengeName(e.target.value)}
                  placeholder="ชื่อกิจกรรม เช่น ท้าพ่อแข่งบอร์ดเกม"
                  className="w-full rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                />
                <div className="flex gap-2">
                  <input
                    value={challengeWin}
                    onChange={(e) => setChallengeWin(e.target.value.replace(/\D/g, ""))}
                    placeholder="ชนะได้กี่แต้ม"
                    className="flex-1 rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                  />
                  <input
                    value={challengeLose}
                    onChange={(e) => setChallengeLose(e.target.value.replace(/\D/g, ""))}
                    placeholder="แพ้เสียกี่แต้ม"
                    className="flex-1 rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                  />
                  <button
                    onClick={() => { addChallenge(challengeName, challengeWin, challengeLose); setChallengeName(""); setChallengeWin(""); setChallengeLose(""); }}
                    className="bg-[#5C4B99] text-white rounded-xl px-3.5 flex items-center justify-center shrink-0"
                  >
                    <Icon size={18}>➕</Icon>
                  </button>
                </div>
              </div>
            </React.Fragment>
          )}

          {section === "rewards" && (
            <React.Fragment>
              {data.rewards.map((r) => (
                <div key={r.id} className="bg-white rounded-2xl px-4 py-3 flex items-center justify-between">
                  <span className="font-semibold text-[#4A4458]">{r.name}</span>
                  <div className="flex items-center gap-3">
                    <span className="text-sm text-[#8b8398]">{r.cost} แต้ม</span>
                    <button onClick={() => removeReward(r.id)} className="text-[#c3757a] p-1">
                      <Icon size={17}>🗑️</Icon>
                    </button>
                  </div>
                </div>
              ))}
              <div className="flex gap-2 pt-1">
                <input
                  value={rewardName}
                  onChange={(e) => setRewardName(e.target.value)}
                  placeholder="ชื่อของรางวัล"
                  className="flex-1 rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                />
                <input
                  value={rewardCost}
                  onChange={(e) => setRewardCost(e.target.value.replace(/\D/g, ""))}
                  placeholder="แต้ม"
                  className="w-16 rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                />
                <button
                  onClick={() => { addReward(rewardName, rewardCost); setRewardName(""); setRewardCost(""); }}
                  className="bg-[#5C4B99] text-white rounded-xl px-3.5 flex items-center justify-center"
                >
                  <Icon size={18}>➕</Icon>
                </button>
              </div>
            </React.Fragment>
          )}

          {section === "pin" && (
            <React.Fragment>
              <p className="text-xs text-[#9c93a3] pb-1">รหัสนี้ใช้ยืนยันตอนให้แต้ม/บันทึกผลแข่ง และตอนเข้าหน้าตั้งค่า (ตัวเลข 4-6 หลัก)</p>
              <div className="space-y-2">
                <input
                  type="password"
                  inputMode="numeric"
                  value={pin1}
                  onChange={(e) => setPin1(e.target.value.replace(/\D/g, "").slice(0, 6))}
                  placeholder="รหัสผ่านใหม่"
                  className="w-full rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                />
                <input
                  type="password"
                  inputMode="numeric"
                  value={pin2}
                  onChange={(e) => setPin2(e.target.value.replace(/\D/g, "").slice(0, 6))}
                  placeholder="พิมพ์รหัสผ่านใหม่อีกครั้ง"
                  className="w-full rounded-xl px-3 py-2.5 border border-[#eee1c6] font-body text-sm focus:outline-none focus:ring-2 focus:ring-[#5C4B99]"
                />
                <button
                  onClick={() => { if (pin1 !== pin2) return; changePin(pin1); setPin1(""); setPin2(""); }}
                  disabled={!pin1 || pin1 !== pin2}
                  className="w-full py-2.5 rounded-xl font-display text-sm bg-[#5C4B99] text-white disabled:opacity-40"
                >
                  บันทึกรหัสผ่านใหม่
                </button>
                {pin1 && pin2 && pin1 !== pin2 && <p className="text-[#FF6B6B] text-xs text-center">รหัสสองช่องไม่ตรงกันค่ะ</p>}
              </div>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RewardJarApp />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        console.log("Service worker registration failed:", err);
      });
    });
  }
</script>
</body>
</html>
